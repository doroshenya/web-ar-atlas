<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Тест AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #0e1a12; color: white; font-family: system-ui, sans-serif; }
    model-viewer { width: 100vw; height: 100vh; background: #1d3426; }
    
    /* Кнопка теперь всегда видна */
    #my-ar-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      border-radius: 30px;
      border: none;
      background: #4caf50;
      color: #04140a;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 9999; /* Поверх всего */
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <model-viewer 
    id="viewer"
    src="models/cactus/scene.gltf"
    ios-src="models/Cactus.usdz"
    alt="3D-модель кактуса"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    camera-controls>
  </model-viewer>

  <!-- Наша кнопка, которая не зависит от model-viewer -->
  <button id="my-ar-btn">ЗАПУСТИТЬ AR</button>

  <script>
    const viewer = document.getElementById('viewer');
    const btn = document.getElementById('my-ar-btn');

    btn.addEventListener('click', async () => {
        // Пытаемся запустить AR программно
        try {
            if (viewer.canActivateAR) {
                await viewer.activateAR();
            } else {
                alert("Ваш браузер не поддерживает AR-режим (canActivateAR = false). Попробуйте открыть в Chrome на Android или Safari на iOS.");
            }
        } catch (e) {
            alert("Ошибка при запуске AR: " + e.message);
        }
    });

    // Проверяем, видит ли model-viewer поддержку AR
    viewer.addEventListener('load', () => {
        console.log("Модель загружена. AR доступен:", viewer.canActivateAR);
    });
  </script>
</body>
</html>
