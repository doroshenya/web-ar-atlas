<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Тест AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #0e1a12; color: white; font-family: system-ui, sans-serif; }
    model-viewer { width: 100vw; height: 100vh; background: #1d3426; }
    #ar-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      background: #4caf50;
      color: #04140a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      z-index: 100;
    }
  </style>
</head>
<body>

  <model-viewer 
    id="viewer"
    src="models/cactus/scene.gltf"
    ios-src="models/Cactus.usdz"
    alt="3D-модель кактуса"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    camera-controls>
    
    <button id="ar-button" slot="ar-button">Поставить на стол</button>
  </model-viewer>

</body>
</html>
