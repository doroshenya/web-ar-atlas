<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест AR</title>
    <!-- Подключаем model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #333; }
        model-viewer { width: 100vw; height: 100vh; background-color: #444; }
    </style>
</head>
<body>
    <!-- Жестко прописываем одну модель (кактус) -->
    <model-viewer 
        src="models/cactus/scene.gltf" 
        ios-src="models/Cactus.usdz"
        alt="Кактус"
        ar 
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor" 
        camera-controls 
        shadow-intensity="1">
    </model-viewer>
</body>
</html>
