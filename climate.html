<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Симуляция климата и AR</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #1a1a1a; color: white; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; width: 250px; z-index: 10; }
        .slider-group { margin-bottom: 10px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; }
        input[type=range] { width: 100%; }
        #stress-indicator { font-size: 18px; font-weight: bold; margin-top: 10px; }
        a { color: #4caf50; text-decoration: none; display: inline-block; margin-bottom: 10px; }
        
        /* Стили для кнопки AR */
        #ar-button { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 20;
            padding: 12px 24px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none; /* Показываем только если AR поддерживается */
        }
        
        /* В AR-режиме скрываем интерфейс, чтобы не мешал */
        body.ar-mode #ui { display: none; }
        body.ar-mode #ar-button { display: none; }
    </style>
</head>
<body>
    <div id="ui">
        <a href="index.html">← Назад в меню</a>
        <h3 id="plant-name">Загрузка...</h3>
        
        <div class="slider-group">
            <label>Температура: <span id="temp-val">22</span>°C</label>
            <input type="range" id="temp-slider" min="-10" max="45" value="22">
        </div>
        
        <div class="slider-group">
            <label>Влажность: <span id="hum-val">50</span>%</label>
            <input type="range" id="hum-slider" min="0" max="100" value="50">
        </div>
        
        <div class="slider-group">
            <label>Свет: <span id="light-val">500</span> лк</label>
            <input type="range" id="light-slider" min="0" max="3000" value="500">
        </div>

        <div id="stress-indicator">Стресс: 0%</div>
    </div>
    
    <button id="ar-button">Разместить в AR</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { calculateStress } from './js/ClimateModel.js';
        import { applyVisualResponse } from './js/PlantVisuals.js';
        import { ParticleManager } from './js/ParticleManager.js';

        let scene, camera, renderer, model, controls, particleManager;
        let currentConditions = { temperature: 22, humidity: 50, light: 500 };
        let plantData = null;
        let reticle = null;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        const urlParams = new URLSearchParams(window.location.search);
        const plantId = urlParams.get('id') || 'cactus';
        const autoStartAR = urlParams.get('ar') === 'true';
        async function init() {
            // 1. Загрузка данных
            try {
                const res = await fetch('data/plants.json');
                const data = await res.json();
                plantData = data.find(p => p.id === plantId);
                if (!plantData) throw new Error("Растение не найдено в JSON");
                document.getElementById('plant-name').textContent = plantData.name;
            } catch (e) {
                console.error("Ошибка загрузки JSON:", e);
                document.getElementById('plant-name').textContent = "Ошибка данных";
                return;
            }

            // 2. Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.5, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.5, 0);
            controls.update();

            particleManager = new ParticleManager(scene);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Земля (горшок) - скроем в AR
            const groundGeo = new THREE.CylinderGeometry(0.5, 0.4, 0.3, 32);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x5a4632 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -0.15;
            ground.name = "ground";
            scene.add(ground);

            // 3. Модель
            const loader = new GLTFLoader();
            loader.load(plantData.url, (gltf) => {
                model = gltf.scene;
                
                // Масштабирование
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const scaleFactor = plantData.height / size.y; 
                model.scale.set(scaleFactor, scaleFactor, scaleFactor);
                
                const boxScaled = new THREE.Box3().setFromObject(model);
                model.position.y = -boxScaled.min.y; 
                
                scene.add(model);
                updatePlantState();
            }, undefined, (error) => {
                console.error("Ошибка загрузки модели:", error);
            });

            // 4. Ползунки
            document.getElementById('temp-slider').addEventListener('input', (e) => {
                currentConditions.temperature = parseFloat(e.target.value);
                document.getElementById('temp-val').textContent = e.target.value;
                updatePlantState();
            });
            document.getElementById('hum-slider').addEventListener('input', (e) => {
                currentConditions.humidity = parseFloat(e.target.value);
                document.getElementById('hum-val').textContent = e.target.value;
                updatePlantState();
            });
            document.getElementById('light-slider').addEventListener('input', (e) => {
                currentConditions.light = parseFloat(e.target.value);
                document.getElementById('light-val').textContent = e.target.value;
                updatePlantState();
            });

            // 5. AR (WebXR)
            const arButton = document.getElementById('ar-button');
            
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        arButton.style.display = 'block';
                        if (autoStartAR) {
                            setTimeout(() => btn.click(), 1500); // Автозапуск через 1.5 секунды
                        }
                        // Создаем AR-кнопку Three.js
                        const btn = ARButton.createButton(renderer, { 
                            requiredFeatures: ['hit-test'],
                            optionalFeatures: ['dom-overlay'],
                            domOverlay: { root: document.getElementById('ui') }
                        });
                        btn.style.display = 'none'; // Скрываем стандартную, используем свою
                        
                        arButton.addEventListener('click', () => {
                            btn.click(); // Программно нажимаем кнопку Three.js
                        });
                    }
                });
            }

            // Настройка ретикла (прицела) для AR
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x4caf50, side: THREE.DoubleSide })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Обработка AR-сессии
            renderer.xr.addEventListener('sessionstart', () => {
                document.body.classList.add('ar-mode');
                scene.background = null; // Прозрачный фон для камеры
                document.querySelector('[name="ground"]').visible = false; // Скрываем горшок
                // Перемещаем модель в 0,0,0 для AR
                if(model) model.position.set(0, 0, 0);
            });

            renderer.xr.addEventListener('sessionend', () => {
                document.body.classList.remove('ar-mode');
                scene.background = new THREE.Color(0x222222);
                document.querySelector('[name="ground"]').visible = true;
                // Возвращаем модель на место
                if(model) {
                     const box = new THREE.Box3().setFromObject(model);
                     model.position.y = -box.min.y;
                }
            });

            // Запуск анимации
            animate();

            // Изменение размера
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            renderer.setAnimationLoop((timestamp, frame) => {
                if (frame) {
                    // Логика Hit-Test для AR
                    if (!hitTestSourceRequested) {
                        const session = renderer.xr.getSession();
                        session.requestReferenceSpace('viewer').then((referenceSpace) => {
                            session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                                hitTestSource = source;
                            });
                        });
                        session.addEventListener('end', () => {
                            hitTestSourceRequested = false;
                            hitTestSource = null;
                        });
                        hitTestSourceRequested = true;
                    }

                    if (hitTestSource) {
                        const hitTestResults = frame.getHitTestResults(hitTestSource);
                        if (hitTestResults.length) {
                            const hit = hitTestResults[0];
                            reticle.visible = true;
                            reticle.matrix.fromArray(hit.getPose(renderer.xr.getReferenceSpace()).transform.matrix);
                        } else {
                            reticle.visible = false;
                        }
                    }
                }

                if (controls && !renderer.xr.isPresenting) controls.update();
                if (particleManager) particleManager.update();
                renderer.render(scene, camera);
            });
        }

        function updatePlantState() {
            if (!model || !plantData) return;
            
            const stress = calculateStress(currentConditions, plantData);
            
            const stressPercent = Math.round(stress * 100);
            const indicator = document.getElementById('stress-indicator');
            indicator.textContent = `Стресс: ${stressPercent}%`;
            
            if (stress < 0.3) indicator.style.color = '#4caf50';
            else if (stress < 0.7) indicator.style.color = '#ffeb3b';
            else indicator.style.color = '#f44336';

            applyVisualResponse(model, stress);

            let weatherMode = null;
            if (currentConditions.temperature > 35) weatherMode = 'dust';
            else if (currentConditions.temperature < 5) weatherMode = 'snow';
            else if (currentConditions.humidity > 90) weatherMode = 'rain';
            
            if (particleManager) particleManager.setMode(weatherMode);
        }
        
        // Обработка клика по экрану в AR для установки модели
        renderer.domElement.addEventListener('click', () => {
            if (renderer.xr.isPresenting && reticle.visible) {
                 if (model) {
                     model.position.setFromMatrixPosition(reticle.matrix);
                 }
            }
        });

        init();
    </script>
</body>
</html>
