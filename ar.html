<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Просмотр растения</title>
    
    <!-- Подключаем model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { 
            margin: 0; 
            font-family: system-ui, sans-serif; 
            background: #0e1a12; 
            color: white;
            overflow: hidden; 
        }
        
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
            background: #1d3426;
            --poster-color: transparent;
        }
        
        /* Кнопка назад */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Красивая кнопка AR (как в практике) */
        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 999px;
            border: none;
            background: #4caf50;
            color: #04140a;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,.4);
            z-index: 100;
        }
    </style>
</head>
<body>

    <button class="back-btn" onclick="history.back()">← Назад</button>

    <!-- 
        model-viewer с атрибутами для AR. 
        slot="ar-button" делает нашу кнопку кнопкой запуска AR.
    -->
    <model-viewer 
        id="viewer"
        src="" 
        ios-src=""
        alt="3D модель растения"
        ar 
        ar-modes="scene-viewer quick-look"
        ar-placement="floor" 
        camera-controls 
        shadow-intensity="1"
        environment-image="neutral">
        
        <button id="ar-button" slot="ar-button">Разместить в AR</button>
    </model-viewer>

    <script>
        const viewer = document.getElementById('viewer');

        // Получаем ID растения
        const urlParams = new URLSearchParams(window.location.search);
        const plantId = urlParams.get('id');

        if (plantId) {
            fetch('data/plants.json')
                .then(res => res.json())
                .then(data => {
                    const plant = data.find(p => p.id === plantId);
                    if (plant) {
                        // Подставляем пути
                        viewer.src = plant.model_glb || plant.url;
                        if (plant.model_usdz) {
                            viewer.setAttribute('ios-src', plant.model_usdz);
                        }
                        viewer.alt = `3D модель растения ${plant.name}`;
                    }
                })
                .catch(err => console.error("Ошибка загрузки JSON:", err));
        }
    </script>
</body>
</html>
