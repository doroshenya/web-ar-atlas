<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Просмотр</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #0e1a12; color: white; font-family: system-ui, sans-serif; }
    model-viewer {
        width: 100vw;
        height: 100vh;
        background: #1d3426;
        --poster-color: transparent;
        
        /* Магия: сдвигаем модель на 50% вверх */
        transform: translateY(20%); 
    }
    #ar-button {
      position: absolute;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      background: #4caf50;
      color: #04140a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      z-index: 100;
    }
  </style>
</head>
<body>

  <model-viewer 
    id="viewer"
    src=""
    ios-src=""
    alt="3D-модель растения"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls>
    
    <button id="ar-button" slot="ar-button">Поставить в AR</button>
  </model-viewer>

  <script>
    const viewer = document.getElementById('viewer');
    const urlParams = new URLSearchParams(window.location.search);
    const plantId = urlParams.get('id');

    if (plantId) {
        fetch('data/plants.json')
            .then(res => res.json())
            .then(data => {
                const plant = data.find(p => p.id === plantId);
                if (plant) {
                    viewer.src = plant.model_glb || plant.url;
                    if (plant.model_usdz) {
                        viewer.setAttribute('ios-src', plant.model_usdz);
                    }
                    viewer.alt = `3D-модель ${plant.name}`;
                }
            });
    }
  </script>
</body>
</html>
