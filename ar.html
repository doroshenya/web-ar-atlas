<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Просмотр растения</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; overflow: hidden; background-color: #f4f7f5; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f4f7f5; }
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            padding: 12px 24px; background: rgba(0, 0, 0, 0.6); color: white;
            border: none; border-radius: 25px; font-size: 16px; font-weight: bold;
            cursor: pointer; backdrop-filter: blur(5px);
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 18px; color: #333; z-index: 10; text-align: center;
        }
        #ar-warning {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: white; padding: 15px 25px;
            border-radius: 12px; font-size: 14px; text-align: center;
            display: none; z-index: 20; max-width: 90%;
        }
    </style>
</head>
<body>

    <div id="loading">Загрузка модели…</div>
    <button class="back-btn" onclick="history.back()">← Назад</button>

    <!-- 
      Убрали ar-scale="fixed". 
      Добавили ar-modes в порядке приоритета: сначала scene-viewer (нативный AR на Android), 
      потом webxr, потом quick-look (iOS).
    -->
    <model-viewer 
        id="plantViewer"
        src="" 
        ios-src=""
        alt="3D модель растения"
        ar 
        ar-modes="scene-viewer webxr quick-look"
        ar-placement="floor" 
        camera-controls 
        shadow-intensity="1"
        environment-image="neutral"
        style="display: none;">
    </model-viewer>

    <div id="ar-warning">
        Ваше устройство не поддерживает AR. <br>
        Вы можете покрутить 3D-модель пальцем.
    </div>

    <script>
        const viewer = document.getElementById('plantViewer');
        const loading = document.getElementById('loading');
        const warning = document.getElementById('ar-warning');

        const urlParams = new URLSearchParams(window.location.search);
        const plantId = urlParams.get('id');

        if (!plantId) {
            loading.textContent = 'Ошибка: не указан ID растения.';
        } else {
            fetch('data/plants.json')
                .then(res => res.json())
                .then(data => {
                    const plant = data.find(p => p.id === plantId);
                    if (!plant) {
                        loading.textContent = 'Растение не найдено.';
                        return;
                    }

                    viewer.src = plant.model_glb || plant.url;
                    if (plant.model_usdz) {
                        viewer.setAttribute('ios-src', plant.model_usdz);
                    }
                    
                    viewer.style.display = 'block';
                    loading.style.display = 'none';

                    // Проверка, поддерживает ли устройство хоть какой-то AR
                    if (navigator.xr) {
                        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                            if (!supported) warning.style.display = 'block';
                        }).catch(() => warning.style.display = 'block');
                    } else {
                        warning.style.display = 'block';
                    }
                })
                .catch(err => {
                    console.error(err);
                    loading.textContent = 'Ошибка загрузки данных.';
                });
        }
    </script>
</body>
</html>
