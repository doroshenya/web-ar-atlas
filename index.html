<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальный AR-атлас растений</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1b14;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1b3626 0%, #0d1b14 100%);
            --text-main: #eef5f0;
            --text-muted: #a3b8aa;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #4ade80;
            --accent-hover: #22c55e;
            --accent-glow: rgba(74, 222, 128, 0.2);
            --input-bg: rgba(0, 0, 0, 0.2);
        }

        body.light-theme {
            --bg-color: #f4f7f5;
            --bg-gradient: radial-gradient(circle at 50% 0%, #e0f2e9 0%, #f4f7f5 100%);
            --text-main: #111814;
            --text-muted: #4a5c51;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --accent: #1e5e36;
            --accent-hover: #144228;
            --accent-glow: rgba(30, 94, 54, 0.2);
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        /* --- ДИНАМИЧЕСКИЕ ФОНЫ ДЛЯ КАТЕГОРИЙ --- */
        .bg-default { background: var(--bg-gradient); }
        .bg-indoor { background: radial-gradient(circle at 50% 0%, #2c3e50 0%, #0d1b14 100%); } /* Дом */
        .bg-succulent { background: radial-gradient(circle at 50% 0%, #8b5a2b 0%, #0d1b14 100%); } /* Пустыня */
        .bg-garden { background: radial-gradient(circle at 50% 0%, #4a7c59 0%, #0d1b14 100%); } /* Сад */

        /* Светлые версии фонов */
        body.light-theme.bg-default { background: var(--bg-gradient); }
        body.light-theme.bg-indoor { background: radial-gradient(circle at 50% 0%, #dce4ed 0%, #f4f7f5 100%); }
        body.light-theme.bg-succulent { background: radial-gradient(circle at 50% 0%, #fcebd5 0%, #f4f7f5 100%); }
        body.light-theme.bg-garden { background: radial-gradient(circle at 50% 0%, #d5f0df 0%, #f4f7f5 100%); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            transition: background 0.6s ease, color 0.4s ease;
        }

        header { padding: 60px 20px 30px; text-align: center; position: relative; max-width: 1200px; margin: 0 auto; }

        .theme-toggle {
            position: absolute; top: 20px; right: 20px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-main); width: 44px; height: 44px;
            border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            font-size: 1.2rem; backdrop-filter: blur(10px);
        }

        h1 { font-size: 3rem; font-weight: 800; margin-bottom: 16px; background: linear-gradient(135deg, var(--text-main) 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        body.light-theme h1 { background: none; -webkit-text-fill-color: var(--text-main); color: var(--text-main); }

        .subtitle { color: var(--text-muted); max-width: 600px; margin: 0 auto 30px; }
        body.light-theme .subtitle { color: var(--text-main); font-weight: 500; }

        .controls { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        .search-bar { width: 100%; max-width: 400px; position: relative; }
        .search-bar input {
            width: 100%; padding: 14px 20px 14px 45px; border-radius: 50px;
            border: 1px solid var(--card-border); background: var(--input-bg);
            color: var(--text-main); font-family: 'Manrope', sans-serif; outline: none;
        }
        .search-bar svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 18px; fill: var(--text-muted); }

        .categories-nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .category-btn {
            background: transparent; border: 1px solid var(--card-border);
            color: var(--text-muted); padding: 10px 24px; border-radius: 50px;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .category-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .catalog-container { max-width: 1200px; margin: 0 auto; padding: 20px 20px 100px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        .plant-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 24px; overflow: hidden; display: flex; flex-direction: column;
            backdrop-filter: blur(20px); position: relative;
        }
        
        .btn-info {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6);
            color: white; border: 1px solid rgba(255,255,255,0.3); padding: 10px 18px;
            border-radius: 20px; font-size: 0.95rem; font-weight: 600; cursor: pointer; z-index: 10;
        }

        .card-img-container { width: 100%; height: 240px; overflow: hidden; background: #1a2a20; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-body { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
        .plant-name { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; }
        .plant-description { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 20px; flex-grow: 1; }

        .actions { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: inline-flex; justify-content: center; align-items: center;
            padding: 14px 24px; border-radius: 12px; font-weight: 600; text-decoration: none; color: #0d1b14;
            background: var(--accent); cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: var(--accent-hover); box-shadow: 0 0 15px var(--accent-glow); }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--bg-color); border: 1px solid var(--card-border);
            border-radius: 24px; width: 90%; max-width: 600px; padding: 30px; position: relative;
        }
        .modal-close { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 2rem; color: var(--text-muted); cursor: pointer; }
        .modal-title { font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
        .modal-info-row { margin-bottom: 15px; }
        .modal-info-label { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
        .modal-info-value { font-size: 1rem; }
        .modal-detail { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--card-border); color: var(--text-muted); }
    </style>
</head>
<body class="bg-default"> <!-- Начальный фон -->

    <header>
        <button class="theme-toggle" id="theme-toggle">🌙</button>
        <div class="header-content">
            <h1>AR-атлас растений</h1>
            <p class="subtitle">Изучайте ботанику в дополненной реальности. Размещайте растения прямо в вашей комнате.</p>
            
            <div class="controls">
                <div class="search-bar">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="search-input" placeholder="Поиск растения...">
                </div>
                
                <!-- ВАЖНО: добавили data-bg для каждого фильтра -->
                <div class="categories-nav" id="filter-nav">
                    <button class="category-btn active" data-filter="all" data-bg="bg-default">Все</button>
                    <button class="category-btn" data-filter="indoor" data-bg="bg-indoor">Комнатные</button>
                    <button class="category-btn" data-filter="garden" data-bg="bg-garden">Садовые</button>
                    <button class="category-btn" data-filter="succulent" data-bg="bg-succulent">Суккуленты</button>
                </div>
            </div>
        </div>
    </header>

    <main class="catalog-container">
        <div id="plants-grid" class="grid"></div>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <h2 class="modal-title" id="modal-title">Название</h2>
            <div class="modal-info-row"><div class="modal-info-label">Тип</div><div class="modal-info-value" id="modal-type">-</div></div>
            <div class="modal-info-row"><div class="modal-info-label">Ареал</div><div class="modal-info-value" id="modal-origin">-</div></div>
            <div class="modal-info-row"><div class="modal-info-label">Уход</div><div class="modal-info-value" id="modal-care">-</div></div>
            <div class="modal-detail" id="modal-detail">-</div>
        </div>
    </div>

    <script>
        let allPlantsData = [];
        const grid = document.getElementById('plants-grid');
        
        // Тема
        document.getElementById('theme-toggle').addEventListener('click', function() {
            document.body.classList.toggle('light-theme');
            this.textContent = document.body.classList.contains('light-theme') ? '☀️' : '🌙';
        });

        // Загрузка
        fetch('data/plants.json')
            .then(res => res.json())
            .then(data => {
                allPlantsData = data;
                renderCards(allPlantsData);
                setupFilters();
            });

        function renderCards(plantsToRender) {
            grid.innerHTML = '';
            if (plantsToRender.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">Ничего не найдено.</p>';
                return;
            }

            plantsToRender.forEach(plant => {
                const imgExt = plant.id === 'fern' ? 'jpeg' : 'jpg';
                const card = document.createElement('article');
                card.className = 'plant-card';
                card.innerHTML = `
                    <button class="btn-info" data-id="${plant.id}">Подробнее</button>
                    <div class="card-img-container">
                        <img src="images/${plant.id}-preview.${imgExt}" alt="${plant.name}" onerror="this.parentElement.style.display='none'">
                    </div>
                    <div class="card-body">
                        <h3 class="plant-name">${plant.name}</h3>
                        <p class="plant-description">${plant.description}</p>
                        <div class="actions">
                            <a href="ar.html?id=${plant.id}" class="btn">Разместить в AR</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.btn-info').forEach(btn => {
                btn.addEventListener('click', (e) => openModal(e.target.getAttribute('data-id')));
            });
        }

        function setupFilters() {
            const buttons = document.querySelectorAll('.category-btn');
            const searchInput = document.getElementById('search-input');

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // --- СМЕНА ФОНА ---
                    const bgClass = btn.getAttribute('data-bg');
                    // Удаляем старые классы фона
                    document.body.className = document.body.className.replace(/bg-\w+/g, '').trim();
                    // Добавляем новый
                    if (bgClass) document.body.classList.add(bgClass);
                    // Возвращаем светлую тему, если она была
                    if (document.body.classList.contains('light-theme')) {
                        document.body.classList.add('light-theme');
                    }

                    filterCards(btn.getAttribute('data-filter'), searchInput.value.toLowerCase());
                });
            });

            searchInput.addEventListener('input', (e) => {
                const activeFilter = document.querySelector('.category-btn.active').getAttribute('data-filter');
                filterCards(activeFilter, e.target.value.toLowerCase());
            });
        }

        function filterCards(categoryFilter, searchQuery) {
            let filtered = allPlantsData;
            if (categoryFilter !== 'all') filtered = filtered.filter(p => p.category === categoryFilter);
            if (searchQuery) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery));
            renderCards(filtered);
        }

        const modal = document.getElementById('modal');
        function openModal(id) {
            const plant = allPlantsData.find(p => p.id === id);
            if (!plant) return;
            document.getElementById('modal-title').textContent = plant.name;
            document.getElementById('modal-type').textContent = plant.type || 'Не указано';
            document.getElementById('modal-origin').textContent = plant.origin || 'Не указано';
            document.getElementById('modal-care').textContent = plant.care || 'Не указано';
            document.getElementById('modal-detail').textContent = plant.detail_text || plant.description;
            modal.classList.add('active');
        }

        document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    </script>
</body>
</html>
