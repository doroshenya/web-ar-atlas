<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальный AR-атлас растений</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    
        <style>
        /* --- Переменные тем --- */
        :root {
            /* Темная тема (по умолчанию) */
            --bg-color: #0d1b14;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1b3626 0%, #0d1b14 100%);
            --text-main: #eef5f0;
            --text-muted: #a3b8aa;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #4ade80;
            --accent-hover: #22c55e;
            --accent-glow: rgba(74, 222, 128, 0.2);
            --btn-secondary-bg: rgba(255, 255, 255, 0.05);
            --btn-secondary-border: rgba(255, 255, 255, 0.1);
            --modal-bg: #16241c;
            --input-bg: rgba(0, 0, 0, 0.2);
            
            --transition-bg: background 0.6s ease, color 0.4s ease;
        }

        /* Светлая тема */
        body.light-theme {
            --bg-color: #f4f7f5;
            --bg-gradient: radial-gradient(circle at 50% 0%, #e0f2e9 0%, #f4f7f5 100%);
            --text-main: #111814; /* Сделали почти черным для контраста */
            --text-muted: #4a5c51; /* Сделали темнее */
            --card-bg: rgba(255, 255, 255, 0.85); /* Сделали карточки более непрозрачными */
            --card-border: rgba(0, 0, 0, 0.08);
            --accent: #1e5e36; /* Темно-зеленый акцент для светлой темы */
            --accent-hover: #144228;
            --accent-glow: rgba(30, 94, 54, 0.2);
            --btn-secondary-bg: rgba(0, 0, 0, 0.04);
            --btn-secondary-border: rgba(0, 0, 0, 0.15);
            --modal-bg: #ffffff;
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        /* --- Динамические фоны для категорий --- */
        .bg-default { background: var(--bg-gradient); }
        .bg-indoor { background: radial-gradient(circle at 50% 0%, #2c3e50 0%, #0d1b14 100%); }
        .bg-succulent { background: radial-gradient(circle at 50% 0%, #8b5a2b 0%, #0d1b14 100%); }
        .bg-garden { background: radial-gradient(circle at 50% 0%, #4a7c59 0%, #0d1b14 100%); }

        /* Светлые версии фонов для категорий */
        body.light-theme.bg-default { background: var(--bg-gradient); }
        body.light-theme.bg-indoor { background: radial-gradient(circle at 50% 0%, #dce4ed 0%, #f4f7f5 100%); }
        body.light-theme.bg-succulent { background: radial-gradient(circle at 50% 0%, #fcebd5 0%, #f4f7f5 100%); }
        body.light-theme.bg-garden { background: radial-gradient(circle at 50% 0%, #d5f0df 0%, #f4f7f5 100%); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            transition: var(--transition-bg);
            -webkit-font-smoothing: antialiased;
        }

        /* --- Шапка сайта --- */
        header {
            padding: 60px 20px 30px;
            text-align: center;
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Переключатель темы */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .theme-toggle:hover { transform: scale(1.1); border-color: var(--accent); }

        .header-content { max-width: 800px; margin: 0 auto; animation: fadeInDown 0.8s ease-out; }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        /* Принудительно делаем заголовок темным в светлой теме */
        body.light-theme h1 {
            background: none;
            -webkit-text-fill-color: var(--text-main);
            color: var(--text-main);
        }

        .subtitle { font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 30px; }
        
        /* Подзаголовок в светлой теме */
        body.light-theme .subtitle {
            color: var(--text-main);
            font-weight: 500;
        }

        /* --- Панель управления (Поиск + Фильтры) --- */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-bar svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-btn {
            font-family: 'Manrope', sans-serif;
            background: var(--btn-secondary-bg);
            border: 1px solid var(--btn-secondary-border);
            color: var(--text-main); /* Изменили на основной текст */
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .category-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
        .category-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }

        /* --- Контейнер каталога --- */
        .catalog-container { max-width: 1200px; margin: 0 auto; padding: 20px 20px 100px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        /* --- Карточка --- */
        .plant-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(20px);
            animation: fadeInUp 0.6s ease-out both;
            position: relative;
        }

        .plant-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 20px var(--accent-glow);
        }

        /* Кнопка "Подробнее" поверх картинки */
        .btn-info {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .btn-info {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 18px; /* Увеличили отступы */
            border-radius: 20px;
            font-size: 0.95rem; /* Увеличили шрифт */
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .btn-info:hover { 
            background: var(--accent); 
            color: #fff; 
            transform: scale(1.05); /* Легкое увеличение при наведении */
        }

        .card-img-container {
            width: 100%;
            height: 240px;
            overflow: hidden;
            position: relative;
            background: #1a2a20;
        }

        .card-img-container::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to top, var(--card-bg), transparent); pointer-events: none;
        }

        .card-img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .plant-card:hover .card-img-container img { transform: scale(1.08); }

        .card-body { padding: 0 24px 24px; display: flex; flex-direction: column; flex-grow: 1; position: relative; z-index: 2; }
        .plant-name { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; color: var(--text-main); }
        .plant-description { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 20px; flex-grow: 1; }

        .fact-box {
            background: rgba(74, 222, 128, 0.05); border-left: 3px solid var(--accent);
            padding: 16px; border-radius: 0 12px 12px 0; margin-bottom: 24px;
        }
        body.light-theme .fact-box { background: rgba(30, 94, 54, 0.05); }

        .fact-box strong { display: block; color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 800; }
        .fact-box p { font-size: 0.9rem; color: var(--text-muted); margin: 0; }

        /* --- Кнопки --- */
        .actions { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            font-family: 'Manrope', sans-serif; display: inline-flex; justify-content: center; align-items: center;
            padding: 14px 24px; border-radius: 12px; font-size: 1rem; font-weight: 600; text-decoration: none;
            cursor: pointer; transition: all 0.2s ease; border: none; width: 100%;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 0 15px var(--accent-glow); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--btn-secondary-border); }
        .btn-outline:hover { background: var(--btn-secondary-bg); border-color: var(--accent); }

        /* --- Модальное окно --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--modal-bg); border: 1px solid var(--card-border);
            border-radius: 24px; width: 90%; max-width: 600px;
            padding: 30px; position: relative;
            transform: translateY(20px); transition: transform 0.3s ease;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-close {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none; font-size: 2rem; color: var(--text-muted);
            cursor: pointer; line-height: 1; transition: color 0.2s;
        }
        .modal-close:hover { color: var(--accent); }

        .modal-title { font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
        .modal-info-row { margin-bottom: 15px; }
        .modal-info-label { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; font-weight: 600; margin-bottom: 4px; }
        .modal-info-value { font-size: 1rem; color: var(--text-main); }
        .modal-detail { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--card-border); color: var(--text-muted); line-height: 1.7; font-size: 0.95rem; }

        .error-message { text-align: center; color: #f87171; font-size: 1.1rem; grid-column: 1 / -1; }

        /* Анимации */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-default">

    <header>
        <button class="theme-toggle" id="theme-toggle" title="Сменить тему">🌙</button>
        <div class="header-content">
            <h1>AR-атлас растений</h1>
            <p class="subtitle">Погрузитесь в мир ботаники с дополненной реальностью. Изучайте модели и экспериментируйте с климатом.</p>
            
            <div class="controls">
                <div class="search-bar">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="search-input" placeholder="Поиск растения...">
                </div>
                
                <div class="categories-nav" id="filter-nav">
                    <button class="category-btn active" data-filter="all" data-bg="bg-default">Все растения</button>
                    <button class="category-btn" data-filter="indoor" data-bg="bg-indoor">Комнатные</button>
                    <button class="category-btn" data-filter="garden" data-bg="bg-garden">Садовые</button>
                    <button class="category-btn" data-filter="succulent" data-bg="bg-succulent">Суккуленты</button>
                </div>
            </div>
        </div>
    </header>

    <main class="catalog-container">
        <div id="plants-grid" class="grid"></div>
    </main>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <h2 class="modal-title" id="modal-title">Название</h2>
            
            <div class="modal-info-row">
                <div class="modal-info-label">Тип</div>
                <div class="modal-info-value" id="modal-type">-</div>
            </div>
            <div class="modal-info-row">
                <div class="modal-info-label">Ареал обитания</div>
                <div class="modal-info-value" id="modal-origin">-</div>
            </div>
            <div class="modal-info-row">
                <div class="modal-info-label">Рекомендации по уходу</div>
                <div class="modal-info-value" id="modal-care">-</div>
            </div>
            
            <div class="modal-detail" id="modal-detail">-</div>
        </div>
    </div>

    <script>
        const plantFacts = {
            "fern": { text: "Папоротники крайне чувствительны к загрязнению среды." },
            "cactus": { text: "Кактусы накапливают влагу в стеблях и могут месяцами без полива." },
            "sunflower": { text: "Молодые подсолнухи поворачивают бутоны вслед за солнцем." }
        };

        let allPlantsData = [];
        const grid = document.getElementById('plants-grid');
        const searchInput = document.getElementById('search-input');
        const themeToggle = document.getElementById('theme-toggle');
        
        // Тема
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            themeToggle.textContent = document.body.classList.contains('light-theme') ? '☀️' : '🌙';
        });

        // Загрузка данных
        fetch('data/plants.json')
            .then(res => res.json())
            .then(data => {
                allPlantsData = data;
                renderCards(allPlantsData);
                setupFilters();
            })
            .catch(err => {
                console.error(err);
                grid.innerHTML = '<p class="error-message">Не удалось загрузить данные.</p>';
            });

        // Отрисовка
        function renderCards(plantsToRender) {
            grid.innerHTML = '';
            if (plantsToRender.length === 0) {
                grid.innerHTML = '<p class="error-message" style="color: var(--text-muted);">Ничего не найдено.</p>';
                return;
            }

            plantsToRender.forEach(plant => {
                const extraInfo = plantFacts[plant.id] || { text: "Информация пополняется." };
                const imgExt = plant.id === 'fern' ? 'jpeg' : 'jpg';

                const card = document.createElement('article');
                card.className = 'plant-card';
                card.innerHTML = `
                    <button class="btn-info" data-id="${plant.id}">Подробнее</button>
                    <div class="card-img-container">
                        <img src="images/${plant.id}-preview.${imgExt}" alt="${plant.name}" onerror="this.parentElement.style.display='none'">
                    </div>
                    <div class="card-body">
                        <h3 class="plant-name">${plant.name}</h3>
                        <p class="plant-description">${plant.description}</p>
                        
                        <div class="fact-box">
                            <strong>Это интересно</strong>
                            <p>${extraInfo.text}</p>
                        </div>

                        <div class="actions">
                            <a href="ar.html?id=${plant.id}" class="btn btn-primary">Открыть в AR</a>
                            <a href="climate.html?id=${plant.id}" class="btn btn-outline">Симуляция климата</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Навешиваем обработчики на кнопки "Подробнее"
            document.querySelectorAll('.btn-info').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const plantId = e.target.getAttribute('data-id');
                    openModal(plantId);
                });
            });
        }

        // Фильтры и фоны
        function setupFilters() {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const filter = btn.getAttribute('data-filter');
                    const bgClass = btn.getAttribute('data-bg');

                    // Смена фона
                    if (bgClass) {
                        document.body.className = document.body.className.replace(/bg-\w+/g, '').trim();
                        document.body.classList.add(bgClass);
                        if (document.body.classList.contains('light-theme')) {
                            document.body.classList.add('light-theme');
                        }
                    }

                    // Фильтрация
                    filterCards(filter, searchInput.value.toLowerCase());
                });
            });
        }

        // Поиск
        searchInput.addEventListener('input', (e) => {
            const activeFilter = document.querySelector('.category-btn.active').getAttribute('data-filter');
            filterCards(activeFilter, e.target.value.toLowerCase());
        });

        function filterCards(categoryFilter, searchQuery) {
            let filtered = allPlantsData;

            if (categoryFilter !== 'all') {
                filtered = filtered.filter(p => p.category === categoryFilter);
            }

            if (searchQuery) {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery));
            }

            renderCards(filtered);
        }

        // Модальное окно
        const modal = document.getElementById('modal');
        const modalClose = document.getElementById('modal-close');

        function openModal(id) {
            const plant = allPlantsData.find(p => p.id === id);
            if (!plant) return;

            document.getElementById('modal-title').textContent = plant.name;
            document.getElementById('modal-type').textContent = plant.type || 'Не указано';
            document.getElementById('modal-origin').textContent = plant.origin || 'Не указано';
            document.getElementById('modal-care').textContent = plant.care || 'Не указано';
            document.getElementById('modal-detail').textContent = plant.detail_text || plant.description;

            modal.classList.add('active');
        }

        modalClose.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });
    </script>
</body>
</html>
